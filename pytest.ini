[pytest]
# Enable coverage for the wpm package (pytest finds it via src layout)
addopts = --cov=wpm --cov-report=term-missing --cov-report=html
# Coverage configuration
[coverage:run]
source = src/wpm
omit = 
    */tests/*
    */test_*
# Coverage reporting
[coverage:report]
precision = 0
skip_covered = False
skip_empty = False

